# ChunkClaim — Türkçe dil dosyası (MiniMessage formatı)
# Eksik anahtarlar jar içindeki varsayılandan tamamlanır.

prefix: "<gradient:#55ff55:#00aa00><bold>Claim</bold></gradient> <dark_gray>» <gray>"

# ---------- Genel ----------
no-permission: "<red>Bu işlem için yetkin yok."
player-only: "<red>Bu komut sadece oyuncular tarafından kullanılabilir."
reloaded: "<green>Yapılandırma yeniden yüklendi."
player-not-found: "<red>Oyuncu bulunamadı: <white>{player}"
state-on: "<green>AÇIK"
state-off: "<red>KAPALI"

# ---------- Claim bloğu (eşya) ----------
claim-block:
  name: "<gradient:#55ff55:#00aa00><bold>Claim Yönetim Bloğu</bold></gradient>"
  lore:
    - "<gray>Bu bloğu yerleştirerek bulunduğun"
    - "<gray>chunk'ı claim edersin."
    - ""
    - "<yellow>Sağ tık <gray>ile yönetim menüsünü aç."

# ---------- Hologram ----------
hologram:
  lines:
    - "<gradient:#55ff55:#00aa00><bold>{name}</bold></gradient>"
    - "<gray>Sahip: <white>{owner}"
    - "<gray>Chunk: <white>{chunks}<gray>/<white>{max_chunks}"
    - "<gray>Üye: <white>{members}<gray>/<white>{max_members}"
    - "<yellow>Sağ tık: Yönetim"

# ---------- Giriş / çıkış (action bar) ----------
titles:
  enter: "<green>▶ <white>{name} <gray>alanına girdin"
  leave: "<red>◀ <white>{name} <gray>alanından çıktın"

# ---------- Oluşturma / silme ----------
creation-default-name: "{player}'in Alanı"
claim-created: "<green>Claim oluşturuldu! <gray>Bloğa sağ tıklayarak yönetebilirsin."
creation-name-prompt: "<yellow>Claim'ine bir isim ver! <gray>Sohbete yaz (en fazla <white>{max}<gray> karakter). Varsayılan için <white>iptal<gray> yaz."
creation-name-default: "<gray>Claim ismi: <white>{name} <dark_gray>(menüden değiştirebilirsin)"
claim-removed: "<yellow>Claim kaldırıldı. <gray>Tüm chunklar serbest bırakıldı."
claim-block-given: "<green>{amount}x claim bloğu verildi: <white>{player}"
claim-block-received: "<green>{amount}x claim bloğu aldın."
chunk-already-claimed: "<red>Bu chunk zaten <white>{name}<red> adlı claim'e ait."
world-not-allowed: "<red>Bu dünyada claim yapılamaz."
max-claims-reached: "<red>Maksimum claim sayısına ulaştın (<white>{max}<red>)."
too-close: "<red>Başka bir claim'e çok yakınsın. En az <white>{distance}<red> chunk uzakta olmalı."
cannot-break-claim-block: "<red>Claim yönetim bloğu kırılamaz."
claim-block-use-menu: "<yellow>Yönetim bloğu kırılamaz. <gray>Claim'i silmek için menüden <white>Claim'i Sil<gray> veya <white>/claim delete<gray> kullan."
delete-confirm-prompt: "<red><bold>SON ADIM:</bold> <gray>Silmeyi onaylamak için claim ismini birebir yaz: <white>{name}<gray>. İptal için <white>iptal<gray> yaz."
delete-name-mismatch: "<red>İsim eşleşmedi, silme iptal edildi. <gray>(Beklenen: <white>{name}<gray>)"
delete-cancelled: "<gray>Silme iptal edildi."

# ---------- Chunk ----------
chunk-claimed: "<green>Chunk claim edildi! <gray>(<white>{chunks}<gray>/<white>{max}<gray>) Ödenen: <white>{cost}"
chunk-unclaimed: "<yellow>Chunk bırakıldı. <gray>İade: <white>{refund}"
chunk-not-adjacent: "<red>Sadece mevcut alanına komşu chunkları claim edebilirsin / bırakınca alan bölünemez."
chunk-limit-reached: "<red>Chunk limitine ulaştın (<white>{max}<red>). <gray>Geliştirme menüsünden limiti artırabilirsin."
chunk-not-yours: "<red>Bu chunk senin claim'ine ait değil."
chunk-is-origin: "<red>Ana chunk (yönetim bloğunun olduğu chunk) bırakılamaz."
chunk-different-world: "<red>Claim'in başka bir dünyada."
not-enough-money: "<red>Yeterli bakiyen yok. <gray>Gerekli: <white>{cost}<gray>, Bakiye: <white>{balance}"

# ---------- Üyeler ----------
member-added: "<green>{player} <gray>üye olarak eklendi."
member-removed: "<yellow>{player} <gray>üyelikten çıkarıldı."
member-already: "<red>{player} <gray>zaten üye."
member-limit-reached: "<red>Üye limitine ulaştın (<white>{max}<red>)."
member-cannot-add-self: "<red>Kendini üye olarak ekleyemezsin."
member-add-prompt: "<yellow>Eklemek istediğin oyuncunun adını sohbete yaz. <gray>İptal için <white>iptal<gray> yaz."
member-add-cancelled: "<gray>Üye ekleme iptal edildi."
member-cannot-remove-manager: "<red>Yönetim yetkisi olan bir üyeyi sadece sahip yönetebilir."
no-claim-permission: "<red>Bu claim'de <white>{permission}<red> iznin yok."
permission-toggled: "<gray>{player} <dark_gray>» <gray>{permission}: {state}"
permission-owner-only: "<red>Yönetim izinlerini sadece claim sahibi verebilir."

# ---------- Ayarlar / geliştirmeler ----------
flag-toggled: "<gray>{flag}: {state}"
upgrade-purchased: "<green>{upgrade} <gray>geliştirildi! <gray>Yeni seviye: <white>{level}"
upgrade-max-level: "<red>Bu geliştirme zaten maksimum seviyede."

# ---------- Koruma ----------
protection-build: "<red>Burada inşa edemezsin."
protection-break: "<red>Burada blok kıramazsın."
protection-interact: "<red>Burada bununla etkileşime giremezsin."
protection-container: "<red>Bu sandığa erişemezsin."
protection-pvp: "<red>Bu alanda PvP kapalı."
protection-animal: "<red>Bu alandaki hayvanlara zarar veremezsin."
protection-enter: "<red>Bu alana giriş yetkin yok."
protection-drop: "<red>Bu alanda eşya atamazsın."
protection-use: "<red>Bu alanda bu eşyayı kullanamazsın."

# ---------- Işınlanma ----------
teleport-warmup: "<gray>{name} <gray>alanına ışınlanıyorsun… <white>{seconds}<gray> saniye hareket etme!"
teleport-countdown: "<aqua>Işınlanma: <white>{seconds}s"
teleport-cancelled: "<red>Işınlanma iptal edildi."
teleport-done: "<green>{name} <gray>alanına ışınlandın."
teleport-failed: "<red>Işınlanma başarısız oldu."
teleport-cooldown: "<red>Tekrar ışınlanmak için <white>{seconds}<red> saniye bekle."
teleport-already-pending: "<red>Zaten bir ışınlanma bekliyor."
teleport-no-home: "<red>Bu claim'in ışınlanma noktası yok."
home-set: "<green>Ev noktası bulunduğun yere ayarlandı."
home-outside-claim: "<red>Ev noktası sadece kendi claim'inin içinde ayarlanabilir."

# ---------- Komutlar ----------
no-claim: "<red>Bir claim'in yok. <gray>Claim bloğu yerleştirerek oluşturabilirsin."
not-in-claim: "<gray>Burası vahşi doğa, kimseye ait değil."
claim-info: "<gray>Claim: <white>{name} <dark_gray>| <gray>Sahip: <white>{owner} <dark_gray>| <gray>Chunk: <white>{chunks}"
not-manage-permission: "<red>Bu işlemi sadece claim sahibi yapabilir."
border-shown: "<gray>{name} <gray>alanının sınırı gösteriliyor…"
name-prompt: "<yellow>Yeni claim ismini sohbete yaz. <gray>İptal için <white>iptal<gray> yaz."
name-changed: "<green>Claim ismi değiştirildi: <white>{name}"
name-too-long: "<red>İsim 1-<white>{max}<red> karakter arasında olmalı."
name-invalid: "<red>İsimde izin verilmeyen karakterler var. <gray>Harf, rakam, boşluk ve _ ' - . ! ? kullanabilirsin."
prompt-expired: "<gray>Sohbet isteği zaman aşımına uğradı."
help: |-
  <gradient:#55ff55:#00aa00><bold>ChunkClaim Komutları</bold></gradient>
  <yellow>/claim <gray>- Yönetim menüsünü aç
  <yellow>/claim info <gray>- Bulunduğun chunk'ın bilgisi
  <yellow>/border <gray>- Alan sınırını göster
  <yellow>/chome <gray>- Claim'ine ışınlan
  <yellow>/claim sethome <gray>- Işınlanma noktasını ayarla
  <yellow>/claim claim <gray>- Bulunduğun chunk'ı claim et
  <yellow>/claim unclaim <gray>- Bulunduğun chunk'ı bırak
  <yellow>/claim delete <gray>- Claim'i sil (onaylı)
  <yellow>/claim give <oyuncu> [adet] <gray>- Claim bloğu ver (admin)
  <yellow>/claim reload <gray>- Yapılandırmayı yenile (admin)

