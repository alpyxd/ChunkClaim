name: ChunkClaim
version: '${version}'
main: dev.alpay.chunkclaim.ChunkClaimPlugin
api-version: '26.2'
author: Alpay
description: Chunk-based land claiming with a control block, hologram, GUI, border preview and economy support
website: https://github.com/alpyxd/ChunkClaim
softdepend: [Vault]

# /border and /chome are registered at runtime with language-specific aliases (lang/<code>.yml → commands.*)
commands:
  claim:
    description: ChunkClaim main command
    usage: /claim [info|border|home|sethome|claim|unclaim|delete|give|reload]
    aliases: [chunkclaim, cc]

permissions:
  chunkclaim.use:
    description: Create and manage claims
    default: true
  chunkclaim.admin:
    description: Admin commands and full access to every claim
    default: op
  chunkclaim.bypass:
    description: Bypass all claim protection
    default: op
